name: update-source

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate source.json
        env:
          ALIST_BASE: ${{ secrets.ALIST_BASE }}
        run: |
          python3 alist_source.py \
            --path "/企业证书 - Apple Certificate" \
            --path "/苹果应用 - Appstore apps" \
            --path "/安卓应用 - Android apps" \
            --path "/微信多开 - WeChat multi-open" \
            --path "/电脑软件 - Computer software" \
            --path "/巨魔商店 - TrollStore" \
            --path "/插件专区 - Plugin Zone" \
            --path "/全球资源 - Global resources/果粉猫网盘/ipa分享" \
            --path "/全球资源 - Global resources/V200网盘/iphone/ipa软件" \
            --path "/全球资源 - Global resources/小熊网盘/iphone/ipa软件" \
            --depth 3 --limit 1500 --workers 10 \
            --icon-base "https://appshelf-egm.pages.dev" \
            --out docs/source.json --cache .cache/ipa.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source.json docs/icons .cache/ipa.json
          git commit -m "chore: update source" || exit 0
          git push
